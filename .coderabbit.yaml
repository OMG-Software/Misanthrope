# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - files: docs/coding-rules.md
        applyTo: "**"
      - files: docs/security-coding-rules.md
        applyTo: "**"
      - files: docs/testing-standards.md
        applyTo: "**"
